[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/git",
    "packages/providers",
    "packages/runtime",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
orchestrator-core = { path = "packages/core" }
orchestrator-git = { path = "packages/git" }
orchestrator-providers = { path = "packages/providers" }
orchestrator-runtime = { path = "packages/runtime" }

async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
libc = "0.2"
parking_lot = "0.12"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v7"] }
which = "8"

tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"

[profile.dev.package."*"]
opt-level = 1
