name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p orchestrator-core -p orchestrator-git -p orchestrator-runtime -p orchestrator-providers -p orchestrator-provider-api -p orchestrator-router -p orchestrator-memory -p orchestrator-engine -p orchestrator-agents -p orchestrator-mcp -p orchestrator-provider-cli -p orchestrator-local --all-targets -- -D warnings
      - name: Test
        run: cargo test -p orchestrator-core -p orchestrator-git -p orchestrator-runtime -p orchestrator-providers -p orchestrator-provider-api -p orchestrator-router -p orchestrator-memory -p orchestrator-engine -p orchestrator-agents -p orchestrator-mcp -p orchestrator-provider-cli -p orchestrator-local

  desktop:
    name: Desktop (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version (one version everywhere, ADR-0019)
        run: pnpm version:check && pnpm test:scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test:web
      - name: Frontend build
        run: pnpm --filter @orchestrator/desktop build
      - name: Clippy (Tauri bridge)
        run: cargo clippy -p orchestrator-desktop --all-targets -- -D warnings
      - name: Test (Tauri bridge)
        run: cargo test -p orchestrator-desktop
