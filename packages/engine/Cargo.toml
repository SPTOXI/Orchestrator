[package]
name = "orchestrator-nativa"
description = "The Native AI's own engine (ADR-0027): the .nativa format, the tokenizer, the transformer and generation, written by the project with no inference library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The GPU backend (phase G1), behind the `gpu` feature: wgpu only reaches
# the system's Vulkan, Metal or DX12 driver; the kernels are the project's.
wgpu = { version = "30", optional = true, default-features = false, features = ["vulkan", "metal", "dx12", "wgsl", "std"] }

[features]
gpu = ["dep:wgpu"]

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }
