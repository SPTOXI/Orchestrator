[package]
name = "orchestrator-provider-api"
description = "Orchestrator API providers: user-registered AI APIs (OpenAI, Anthropic, Gemini and any HTTP/JSON API) behind AIProvider (ADR-0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
orchestrator-core.workspace = true
orchestrator-providers.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
orchestrator-runtime.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
