[package]
name = "orchestrator-provider-cli"
description = "Orchestrator CLI providers: Claude Code, Codex and Gemini CLI on the user's subscription, with the Orchestrator's tools over MCP (ADR-0021)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
orchestrator-core.workspace = true
orchestrator-mcp.workspace = true
orchestrator-providers.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util", "process"] }
tokio-util.workspace = true
uuid.workspace = true
which.workspace = true

[dev-dependencies]
orchestrator-runtime.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time"] }

[[bin]]
# Pretends to be claude / codex / gemini for the tests (not shipped).
name = "fake-cli"
path = "src/bin/fake-cli.rs"
test = false
doc = false
