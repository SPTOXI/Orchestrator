[package]
name = "orchestrator-desktop"
description = "Orchestrator desktop shell: Tauri IPC bridge between the React UI and the Rust runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "orchestrator_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
orchestrator-core.workspace = true
orchestrator-runtime.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true

[target.'cfg(unix)'.dependencies]
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
